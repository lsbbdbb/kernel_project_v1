services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app:z
      - /home/lee/kernel-livepatch-agent/acceptance_vm_20260525/source_tree/linux-6.6.102-5.2.an23:/kernel-src/linux-6.6.102-5.2.an23.x86_64:z
    working_dir: /app
    environment:
      - KERNEL_SRC=/kernel-src/linux-6.6.102-5.2.an23.x86_64
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
    command: ["test"]

  agent-dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app:z
      - /home/lee/kernel-livepatch-agent/acceptance_vm_20260525/source_tree/linux-6.6.102-5.2.an23:/kernel-src/linux-6.6.102-5.2.an23.x86_64:z
    working_dir: /app
    environment:
      - KERNEL_SRC=/kernel-src/linux-6.6.102-5.2.an23.x86_64
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
    stdin_open: true
    tty: true
    command: ["shell"]

  agent-run:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app:z
      - /home/lee/kernel-livepatch-agent/acceptance_vm_20260525/source_tree/linux-6.6.102-5.2.an23:/kernel-src/linux-6.6.102-5.2.an23.x86_64:z
      - agent-output:/tmp/test_workspace
      - ${HOME}/.ssh:/root/.ssh:ro,z
    working_dir: /app
    environment:
      - KERNEL_SRC=/kernel-src/linux-6.6.102-5.2.an23.x86_64
      - WORKDIR=/tmp/test_workspace
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - VM_HOST=${VM_HOST:-}
      - VM_POC=${VM_POC:-}
    command: ["run"]

  agent-run-no-llm:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app:z
      - /home/lee/kernel-livepatch-agent/acceptance_vm_20260525/source_tree/linux-6.6.102-5.2.an23:/kernel-src/linux-6.6.102-5.2.an23.x86_64:z
      - agent-output:/tmp/test_workspace
    working_dir: /app
    environment:
      - KERNEL_SRC=/kernel-src/linux-6.6.102-5.2.an23.x86_64
      - WORKDIR=/tmp/test_workspace
    command: ["run-no-llm"]

volumes:
  agent-output:

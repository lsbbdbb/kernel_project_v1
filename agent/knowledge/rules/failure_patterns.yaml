- pattern_id: apply.reversed_patch
  category: kpatch_limit
  reason_code: already_backported
  matchers:
    - "Reversed (or previously applied) patch detected"
    - "hunks ignored"
  action: manual_required
  auto_retry_allowed: false
  requires_human_review: true

- pattern_id: apply.hunk_failed
  category: patch_apply
  reason_code: hunk_failed
  matchers:
    - "hunk FAILED"
    - "patch does not apply"
    - "error: patch failed"
    - "fuzz"
    - "file failed to apply"
  action: rewrite
  auto_retry_allowed: true
  requires_human_review: false

- pattern_id: compile.api_args
  category: compile
  reason_code: api_mismatch
  matchers:
    - "too many arguments to function"
    - "too few arguments to function"
    - "error: passing argument"
  action: rewrite
  auto_retry_allowed: true
  requires_human_review: false

- pattern_id: kpatch.no_fentry
  category: kpatch_limit
  reason_code: no_fentry
  matchers:
    - "no fentry call"
    - "function is not traceable"
  action: manual_required
  auto_retry_allowed: false
  requires_human_review: true

- pattern_id: kpatch.data_change
  category: kpatch_limit
  reason_code: struct_or_data_change
  matchers:
    - "data structure layout change"
    - "static variable changed"
    - "unreconcilable difference"
    - "section change"
  action: manual_required
  auto_retry_allowed: false
  requires_human_review: true

- pattern_id: kpatch.symbol_section_offset
  category: kpatch_limit
  reason_code: symbol_section_offset
  matchers:
    - "kpatch_bundle_symbols:.*symbol .* at offset .* within section .* expected 0"
  action: manual_required
  auto_retry_allowed: false
  requires_human_review: true

- pattern_id: apply.file_missing
  category: patch_apply
  reason_code: file_missing
  matchers:
    - "No such file or directory"
    - "cannot find file"
  action: manual_required
  auto_retry_allowed: false
  requires_human_review: true

- pattern_id: compile.implicit_decl
  category: compile
  reason_code: missing_api_or_include
  matchers:
    - "implicit declaration of function"
    - "error: implicit declaration"
  action: rewrite
  auto_retry_allowed: true
  requires_human_review: false

- pattern_id: compile.unknown_field
  category: compile
  reason_code: field_mismatch
  matchers:
    - "has no member named"
  action: rewrite
  auto_retry_allowed: true
  requires_human_review: false

- pattern_id: compile.undefined_symbol
  category: compile
  reason_code: undefined_symbol
  matchers:
    - "undefined reference"
    - "undefined symbol"
  action: rewrite
  auto_retry_allowed: true
  requires_human_review: false

- pattern_id: env.no_vmlinux
  category: env_missing
  reason_code: missing_vmlinux
  matchers:
    - "vmlinux not found"
    - "cannot find vmlinux"
    - "ERROR:.*vmlinux"
  action: fix_environment
  auto_retry_allowed: false
  requires_human_review: false

- pattern_id: env.source_permission
  category: env_missing
  reason_code: source_permission_denied
  matchers:
    - "Permission denied"
    - "Operation not permitted"
  action: fix_environment
  auto_retry_allowed: false
  requires_human_review: false

- pattern_id: env.git_ownership
  category: env_missing
  reason_code: git_unsafe_ownership
  matchers:
    - "detected dubious ownership"
    - "safe.directory"
  action: fix_environment
  auto_retry_allowed: false
  requires_human_review: false

- pattern_id: env.kernel_release_mismatch
  category: env_missing
  reason_code: kernel_mismatch
  matchers:
    - "kernel release mismatch"
  action: fix_environment
  auto_retry_allowed: false
  requires_human_review: false

- pattern_id: env.setlocalversion_unsupported
  category: env_missing
  reason_code: setlocalversion_incompatible
  matchers:
    - "Usage: ./scripts/setlocalversion"
    - "--save-scmversion"
  action: fix_environment
  auto_retry_allowed: false
  requires_human_review: false

- pattern_id: env.missing_build_tool
  category: env_missing
  reason_code: missing_build_tool
  matchers:
    - "openssl: command not found"
  action: fix_environment
  auto_retry_allowed: false
  requires_human_review: false

- pattern_id: env.compiler_mismatch
  category: env_missing
  reason_code: compiler_mismatch
  matchers:
    - "gcc/kernel version mismatch"
  action: fix_environment
  auto_retry_allowed: false
  requires_human_review: false

- pattern_id: kpatch.no_changed_objects
  category: kpatch_limit
  reason_code: no_changed_objects
  matchers:
    - "no changed objects found"
  action: manual_required
  auto_retry_allowed: false
  requires_human_review: true

- pattern_id: env.syncconfig
  category: env_missing
  reason_code: syncconfig
  matchers:
    - "Error during sync of the configuration"
    - "syncconfig"
    - "include/config/auto.conf"
  action: fix_environment
  auto_retry_allowed: true
  requires_human_review: false

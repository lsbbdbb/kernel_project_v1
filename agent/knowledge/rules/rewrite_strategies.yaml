- strategy_id: context_drift
  description: "Re-contextualize hunk to match target source tree"
  allowed: true
  semantic_guards:
    - "must_preserve_all_added_checks"
    - "must_preserve_error_return_paths"
  validation:
    - "git apply --check"

- strategy_id: api_mismatch
  description: "Adapt function call to match target kernel API"
  allowed: true
  semantic_guards:
    - "must_preserve_security_boundary_checks"
    - "must_preserve_error_return_paths"
  validation:
    - "git apply --check"
    - "kpatch-build"

- strategy_id: missing_include
  description: "Add or adapt includes, declarations, or symbol references for target kernel APIs"
  allowed: true
  semantic_guards:
    - "must_not_change_fix_logic"
    - "must_preserve_security_boundary_checks"
  validation:
    - "git apply --check"
    - "kpatch-build"

- strategy_id: no_fentry
  description: "Move fix to a hookable caller function"
  allowed: false
  requires_human_review: true
  semantic_guards:
    - "must_not_broaden_fix_scope"
    - "must_cover_all_vulnerability_paths"
  validation:
    - "manual_semantic_review"

- strategy_id: struct_abi
  description: "Generate wrapper function for struct member changes"
  allowed: false
  requires_human_review: true
  semantic_guards:
    - "must_keep_original_struct_layout"
    - "wrapper_must_preserve_semantics"
  validation:
    - "git apply --check"
    - "kpatch-build"

- strategy_id: data_change
  description: "Convert static variable modification to dynamic allocation"
  allowed: false
  requires_human_review: true
  semantic_guards:
    - "must_not_leak_allocated_memory"
    - "must_initialize_before_first_use"
  validation:
    - "git apply --check"
    - "kpatch-build"
